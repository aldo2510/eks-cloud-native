apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-karpenter
spec:
  selector:
    matchLabels:
      run: karpenter-lab
  template:
    metadata:
      labels:
        run: karpenter-lab
    spec:
      nodeSelector:
        app: karpenter-lab
      containers:
      - name: inflated
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: svc-karpenter
  labels:
    run: svc-karpenter
spec:
  ports:
  - port: 80
  selector:
    run: karpenter-lab