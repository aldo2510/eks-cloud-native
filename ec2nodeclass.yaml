apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ec2nodeclass-karpenter
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: "KarpenterNodeRole-EKS-Lab"
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: EKS-Lab
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: EKS-Lab
  tags:
    eks: EKS-Lab
    app: karpenter-lab